name: RUANG VISUAL — Market Intelligence Pipeline

on:
  # 1. Jadwal Otomatis: Setiap Senin & Kamis pukul 09:00 WITA (01:00 UTC)
  schedule:
    - cron: '0 1 * * 1,4'

  # 2. Eksekusi Manual dari HP / Web GitHub (On-Demand)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pilih modul pipeline'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - gmaps
          - facebook
          - instagram
          - tiktok
          - matrix
          - clean-sheets
          - export-csv
      limit:
        description: 'Batas query pencarian (default: 2)'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run (tidak sync ke Google Sheets)'
        required: false
        default: false
        type: boolean

  # 3. Pemicu Webhook API dari Bot Telegram / Vercel Web App
  repository_dispatch:
    types:
      - telegram_command
      - trigger_pipeline

jobs:
  run-pipeline:
    name: Run Intelligence Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Headless Browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Pipeline
        env:
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          MODE="${{ github.event.client_payload.mode || github.event.inputs.mode || 'gmaps' }}"
          LIMIT="${{ github.event.client_payload.limit || github.event.inputs.limit || '5' }}"
          DRY_RUN="${{ github.event.client_payload.dry_run || github.event.inputs.dry_run }}"

          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          if [ "$MODE" = "gmaps" ] || [ "$MODE" = "all" ]; then
            echo "Menjalankan perayapan Google Maps..."
            python pipeline.py gmaps --query "cafe" --city Makassar --limit "$LIMIT" $DRY_FLAG
            python pipeline.py match
          fi

          if [ "$MODE" = "harvest" ]; then
            echo "Menjalankan panen prospek Makassar..."
            python pipeline.py harvest --sector fnb_hospitality --limit-per-query "$LIMIT" $DRY_FLAG
            python pipeline.py match
          fi

          if [ "$MODE" = "export-csv" ] || [ "$MODE" = "all" ] || [ "$MODE" = "gmaps" ]; then
            python pipeline.py export
          fi

      - name: Send Telegram Summary Report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT__TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Mengirim ringkasan laporan ke Telegram..."
          python pipeline.py telegram --notify "summary" || echo "Gagal mengirim notifikasi Telegram"

      - name: Upload Scraped Intelligence Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruang-visual-market-data
          path: |
            data/processed/
            data/raw/
            data/leads.sqlite
          retention-days: 14

      - name: Commit and Push Processed Data
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/leads.sqlite data/processed/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data baru untuk di-commit."
          else
            git commit -m "chore(data): auto-update cloud scraped leads [skip ci]"
            git push || echo "Push skipped"
          fi
